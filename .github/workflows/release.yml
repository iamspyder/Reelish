name: Build and verify Reelish
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            args: --win --x64
          - os: macos-15
            platform: macos-arm64
            args: --mac --arm64
          - os: macos-15-intel
            platform: macos-x64
            args: --mac --x64
          - os: ubuntu-22.04
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare bundled offline speech engine
        run: npm run prepare:speech
      - run: npm test
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libdrm2 libgbm1 libasound2 libgtk-3-0 libfuse2
      - name: Package desktop application
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Verify packaged captioning and video export
        if: runner.os != 'Linux'
        run: node scripts/ci-smoke.cjs
      - name: Verify packaged Linux captioning and video export
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/ci-smoke.cjs
      - name: Upload verified release artifacts
        run: node scripts/upload-release.cjs
